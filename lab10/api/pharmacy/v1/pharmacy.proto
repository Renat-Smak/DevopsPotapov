syntax = "proto3";

package pharmacy.v1;

option go_package = "example.com/devops-lab6/api/pharmacy/v1;pharmacyv1";

service PharmacyService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc GetByID(GetByIDRequest) returns (GetByIDResponse);
  rpc Sell(SellRequest) returns (SellResponse);
}

message Medicine {
  string id = 1;
  string name = 2;
  string manufacturer = 3;
  double price = 4;
  bool prescription = 5;
  int64 quantity = 6;
}

message CreateRequest {
  Medicine medicine = 1;
}

message CreateResponse {
  string id = 1;
}

message GetByIDRequest {
  string id = 1;
}

message GetByIDResponse {
  Medicine medicine = 1;
}

message SellRequest {
  string id = 1;
  int64 count = 2;
}

message SellResponse {}
